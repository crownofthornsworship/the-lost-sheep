  </section>

</section></main>
<script>
(()=>{'use strict';

let W=0,H=0,raf,last=0,running=false,paused=false,level=0,found=0,hearts=3,grace=0,callWave=0,keys={},joy=0,lostSheep=0,noticeUntil=0,noticeText='',runScore=0,awardedLevel=-1;
let player={x:0,y:0,r:18,dir:1,inv:0},sheep=[],wolves=[],rocks=[],flowers=[],prints=[];
const truths=[
 {icon:'👀',title:'You Are Known',text:'God sees every person and knows each one by name. No child is invisible to Him.',verse:'“I am the good shepherd. I know my sheep, and my sheep know me.” — John 10:14 (ERV)'},
 {icon:'🔎',title:'Jesus Seeks the Lost',text:'Jesus did not wait for lost people to become good enough. He came looking for us.',verse:'“The Son of Man came to find lost people and save them.” — Luke 19:10 (ERV)'},
 {icon:'🤲',title:'Jesus Carries Us',text:'The shepherd joyfully carries the sheep home. Jesus is strong enough to rescue us.',verse:'“And when he finds it, he happily puts it on his shoulders.” — Luke 15:5 (ERV)'},

 {icon:'🎁',title:'Rescue Is a Gift',text:'You rescued sheep to play this game—but you can never earn God’s rescue. Jesus saves us because He loves us.',verse:'“You have been saved by grace because you believed. You did not save yourselves. It was a gift from God.” — Ephesians 2:8 (ERV)'},
 {icon:'👂',title:'His Sheep Hear Him',text:'Jesus still leads His people through His Word and by His Spirit. We learn to recognize and follow His voice.',verse:'“My sheep listen to my voice. I know them, and they follow me.” — John 10:27 (ERV)'},
 {icon:'🛡️',title:'Safe in His Hand',text:'Trouble can feel frightening, but everyone who belongs to Jesus is held securely by Him.',verse:'“I give my sheep eternal life. They will never die, and no one can take them out of my hand.” — John 10:28 (ERV)'},
 {icon:'🌱',title:'Life to the Full',text:'Jesus does more than lead us away from danger. He gives us a new life with Him that begins now and lasts forever.',verse:'“I came to give life—life that is full and good.” — John 10:10 (ERV)'},

];
const levels=[
 {name:'Sunny Meadow',need:3,wolves:0,color:'#73bd67',sky:'#7ed6e9',tip:'Follow the golden hoofprints'},
 {name:'Bramble Hollow',need:4,wolves:1,color:'#58a660',sky:'#86cbd7',tip:'Watch for the bramble wolf—CALL sends it away'},
 {name:'Moonlit Hills',need:5,wolves:2,color:'#3f8b68',sky:'#315f77',tip:'Watch for wolves—your call sends them away'},
 {name:'River Crossing',need:5,wolves:1,color:'#4b9d74',sky:'#65bdd5',tip:'Gather the flock along the winding river'},
 {name:'Desert Pass',need:6,wolves:2,color:'#b68a48',sky:'#e7ae65',tip:'Search the wide pass and stay close together'},
 {name:'Starry Valley',need:7,wolves:3,color:'#315c55',sky:'#243b68',tip:'Use your call to light the dark valley'},
 {name:'Homeward Trail',need:8,wolves:3,color:'#518d55',sky:'#e99b67',tip:'Bring every sheep safely home'},
 {name:'Clover Ridge',need:5,wolves:1,color:'#78b96b',sky:'#acdbea',tip:'Follow the ridge to find five sheep'},
 {name:'Dawn Orchard',need:6,wolves:2,color:'#78a851',sky:'#f9b785',tip:'Call your flock through the orchard'},
 {name:'Silver Brook',need:6,wolves:2,color:'#6bb2a4',sky:'#9fd8ed',tip:'Search beside the silver brook'},
 {name:'Lantern Meadow',need:7,wolves:2,color:'#507f72',sky:'#516887',tip:'Bring the flock together under the stars'},
 {name:'Wildflower Rise',need:7,wolves:3,color:'#86b878',sky:'#f6c782',tip:'Find sheep among the wildflowers'},
 {name:'Quiet Pines',need:8,wolves:3,color:'#548963',sky:'#90b6a2',tip:'Use CALL to keep wolves away'},
 {name:'Welcome Valley',need:8,wolves:3,color:'#64a568',sky:'#f6bd92',tip:'Gather the flock for the journey home'}
];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=shell.clientWidth;H=shell.clientHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)} addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const Y_TOP=80,Y_BOTTOM=20,spanY=()=>H-Y_TOP-Y_BOTTOM,wrapX=x=>((x%W)+W)%W,wrapY=y=>Y_TOP+(((y-Y_TOP)%spanY())+spanY())%spanY(),deltaX=(a,b)=>{let d=a-b;return d>W/2?d-W:d<-W/2?d+W:d},deltaY=(a,b)=>{let d=a-b,n=spanY();return d>n/2?d-n:d<-n/2?d+n:d},distance=(a,b)=>Math.hypot(deltaX(a.x,b.x),deltaY(a.y,b.y));
function startGame(){ui.start.classList.add('hidden');ui.hud.classList.remove('hidden');ui.controls.classList.remove('hidden');ui.mission.classList.remove('hidden');level=0;grace=0;hearts=3;runScore=0;awardedLevel=-1;loadLevel();running=true;last=performance.now();raf=requestAnimationFrame(loop)}
function newSheep(){return{x:rnd(45,W-45),y:rnd(105,H*.62),r:17,found:false,everFound:false,dead:false,wolfHits:0,inv:1.5,calm:0,phase:rnd(0,6)}}
function loadLevel(){found=0;lostSheep=0;noticeText='';noticeUntil=0;joy=0;player={x:W/2,y:H*.72,r:18,dir:1,inv:0};sheep=[];wolves=[];rocks=[];flowers=[];prints=[];const L=levels[level];
 for(let i=0;i<L.need+(L.wolves?3:0);i++) sheep.push(newSheep());
 for(let i=0;i<L.wolves;i++) wolves.push({x:rnd(40,W-40),y:rnd(130,H*.55),vx:rnd(-30,30),vy:rnd(-30,30),phase:rnd(0,6),attack:0,turn:rnd(1,3)});
 for(let i=0;i<10+level*2;i++) rocks.push({x:rnd(25,W-25),y:rnd(100,H-90),r:rnd(10,20)});
 for(let i=0;i<32;i++) flowers.push({x:rnd(10,W-10),y:rnd(95,H-15),c:['#ffd65a','#fff','#ec7782','#8bdcf0'][i%4]});
 sheep.forEach(s=>{for(let j=0;j<3;j++)prints.push({x:s.x+rnd(-65,65),y:s.y+rnd(30,110),a:rnd(-1,1)})});updateHud();ui.mission.textContent=L.tip;
}
function updateHud(){ui.level.innerHTML=`${levels[level].name} <span class="level-count">${level+1}/${levels.length}</span>`;const spare=Math.max(0,sheep.filter(s=>!s.dead).length-levels[level].need);ui.sheep.textContent=`🐑 ${found}/${levels[level].need}${levels[level].wolves?' · +'+spare:''}`;ui.sheep.setAttribute('aria-label',`${found} of ${levels[level].need} sheep gathered; ${spare} extra sheep`);ui.hearts.textContent='♥ '.repeat(hearts).trim()+' ♡ '.repeat(3-hearts).trim()}
function alertFlock(message,seconds=2.7){noticeText=message;noticeUntil=performance.now()+seconds*1000;ui.mission.textContent=message}
function scatterFlock(){let scattered=0;sheep.forEach(s=>{if(!s.found||s.dead)return;s.found=false;s.calm=0;s.inv=2;s.x=wrapX(s.x+rnd(-115,115));s.y=wrapY(s.y+rnd(-100,70));scattered++});found=0;updateHud();if(scattered)alertFlock(`The bramble wolf scattered ${scattered} sheep! Gather them again.`);else alertFlock('The bramble wolf caught the shepherd!')}
function wolfGetsSheep(s){s.wolfHits++;s.inv=1.9;if(s.found){s.found=false;found=Math.max(0,found-1)}s.calm=0;if(s.wolfHits>3){s.dead=true;lostSheep++;alertFlock('A sheep was lost after four wolf attacks. Find another sheep.');if(sheep.filter(q=>!q.dead).length<levels[level].need){const replacement=newSheep();replacement.inv=3;sheep.push(replacement)}}else{let angle=rnd(0,Math.PI*2);s.x=wrapX(s.x+Math.cos(angle)*90);s.y=wrapY(s.y+Math.sin(angle)*90);alertFlock(`Bramble wolf attack: this sheep has been caught ${s.wolfHits}/4 times.`)}updateHud()}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.04);last=t;if(!paused)update(dt);draw(t/1000);raf=requestAnimationFrame(loop)}
function update(dt){let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);dx+=joy.x||0;dy+=joy.y||0;const m=Math.hypot(dx,dy)||1,spd=150;player.x=wrapX(player.x+dx/m*spd*dt);player.y=wrapY(player.y+dy/m*spd*dt);if(Math.abs(dx)>.1)player.dir=Math.sign(dx);player.inv=Math.max(0,player.inv-dt);callWave=Math.max(0,callWave-dt*120);
 if(noticeText&&performance.now()>noticeUntil){noticeText='';ui.mission.textContent=levels[level].tip}
 sheep.forEach((s,i)=>{if(!running||s.dead)return;s.phase+=dt*2;s.inv=Math.max(0,s.inv-dt);if(s.found){const rescued=sheep.filter(q=>q.found&&!q.dead),pos=rescued.indexOf(s),ang=(pos%2?1:-1)*(.55+Math.floor(pos/2)*.18),dist=38+Math.floor(pos/2)*28,tx=player.x-Math.cos(ang)*dist*player.dir,ty=player.y+Math.sin(ang)*dist;s.x=wrapX(s.x+deltaX(tx,s.x)*Math.min(1,dt*3.2));s.y=wrapY(s.y+deltaY(ty,s.y)*Math.min(1,dt*3.2));return}if(distance(player,s)<52){s.calm=Math.min(1,s.calm+dt*1.8);if(s.calm>=1)rescue(s,i)}else s.calm=Math.max(0,s.calm-dt*.5)});
 if(!running)return;
 for(const w of wolves){w.attack=Math.max(0,w.attack-dt);w.turn-=dt;if(w.turn<=0){const angle=rnd(0,Math.PI*2),speed=rnd(22,43);w.vx=Math.cos(angle)*speed;w.vy=Math.sin(angle)*speed;w.turn=rnd(1.8,3.8)}w.x+=w.vx*dt;w.y+=w.vy*dt;w.x=wrapX(w.x);w.y=wrapY(w.y);
  if(distance(player,w)<32&&!player.inv&&!w.attack){hearts--;player.inv=1.7;w.attack=1.2;scatterFlock();player.x=W/2;player.y=H*.78;updateHud();navigator.vibrate?.(80);if(hearts<=0){showRetry();break}continue}
  if(w.attack)continue;for(const s of sheep){if(s.dead||!s.found||s.inv)continue;if(distance(w,s)<33){w.attack=1.6;wolfGetsSheep(s);navigator.vibrate?.(35);break}}
 }
}
function rescue(s,i){s.found=true;found++;const firstTime=!s.everFound;s.everFound=true;if(firstTime){grace++;runScore+=20}updateHud();navigator.vibrate?.([30,40,30]);if(!firstTime){if(found>=levels[level].need){running=false;cancelAnimationFrame(raf);if(level<levels.length-1)showLevelWin();else showFinal()}else alertFlock('One sheep is back with the flock!',1.5);return}running=false;cancelAnimationFrame(raf);showTruth(Math.min(level===0?found-1:level+2,truths.length-1),()=>{if(found>=levels[level].need){if(level<levels.length-1)showLevelWin();else showFinal()}else{running=true;last=performance.now();raf=requestAnimationFrame(loop)}})}
function call(){if(!running||paused)return;callWave=110;navigator.vibrate?.(25);wolves.forEach(w=>{let dx=deltaX(w.x,player.x),dy=deltaY(w.y,player.y),d=Math.hypot(dx,dy)||1;if(d<180){w.vx=dx/d*210;w.vy=dy/d*210}});sheep.forEach(s=>{if(!s.found&&distance(s,player)<150)s.calm=Math.min(1,s.calm+.42)})}
